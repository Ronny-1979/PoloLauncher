<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="node_modules/maplibre-gl/dist/maplibre-gl.css">
<style>html,body,#map{margin:0;height:100%;width:100%}</style></head><body><div id="map"></div>
<script src="node_modules/maplibre-gl/dist/maplibre-gl.js"></script>
<script>
const q=new URLSearchParams(location.search);
window.map=new maplibregl.Map({container:'map',style:q.get('style'),center:[9.9937,53.5511+150/110574],zoom:+q.get('z'),pitch:+q.get('pitch'),bearing:+q.get('bearing'),fadeDuration:0,attributionControl:false});
window.errs=[];map.on('error',e=>errs.push(String(e.error&&e.error.message||e.message)));
map.on('idle',()=>{window.done=true});
</script></body></html>
