plugins {
    id 'com.android.application'
}

android {
    namespace 'de.ronny.pololauncher'
    compileSdk 35

    defaultConfig {
        applicationId 'de.ronny.pololauncher'
        minSdk 26
        targetSdk 33
        // PBF import adds protobuf/Osmosis classes. Android 5+ supports native multidex.
        multiDexEnabled true
        // The radio is ARM: without a filter MapLibre ships four native ABIs (x86 included).
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
        versionCode 220
        versionName '0.31.139'
    }

    buildFeatures {
        // Required because WeatherClient/LocalityClient use BuildConfig.VERSION_NAME.
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Osmosis core/pbf2 both ship the same root Java resource. AGP 8.7 otherwise
    // aborts :app:mergeDebugJavaResource with "2 files found with path 'osmosis-plugins.conf'".
    // We instantiate PbfReader directly, but keep one copy instead of deleting the resource entirely.
    packaging {
        resources {
            pickFirsts += ['osmosis-plugins.conf']
        }
    }

    // Nur für den GitHub-Build: Ist DEBUG_KEYSTORE_PATH gesetzt, wird genau diese Debug-Schlüsseldatei
    // zum Signieren benutzt (damit die APK die bestehende App aktualisieren kann). Ohne die Variable
    // (z. B. Android Studio am PC) bleibt alles wie bisher: der Standard-Debug-Schlüssel.
    signingConfigs {
        debug {
            def ciKeystore = System.getenv('DEBUG_KEYSTORE_PATH')
            if (ciKeystore) {
                storeFile file(ciKeystore)
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    // MapLibre renders both Offline Deutschland and the optional OpenFreeMap online map.
    implementation 'org.maplibre.gl:android-sdk:11.8.0'
    // Read Geofabrik .osm.pbf on the radio once, then keep only our compact SQLite traffic DB.
    implementation('org.openstreetmap.osmosis:osmosis-core:0.49.2') {
        exclude group: 'net.sf.jpf', module: 'jpf'
    }
    implementation('org.openstreetmap.osmosis:osmosis-pbf2:0.49.2') {
        exclude group: 'net.sf.jpf', module: 'jpf'
    }
}
