name: Build APK

# Baut die Debug-APK (wie BUILD_APK_WINDOWS.bat) und legt sie als GitHub-Release ab.
# Start: automatisch bei jedem Push auf main (außer reinen Doku-Änderungen) oder von Hand
# über Actions -> Build APK -> Run workflow.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Version lesen
        id: ver
        run: echo "v=$(grep -oP "versionName '\K[^']+" app/build.gradle)" >> "$GITHUB_OUTPUT"

      - name: APK bauen
        run: sh gradlew assembleDebug --no-daemon --stacktrace

      - name: APK umbenennen
        run: cp app/build/outputs/apk/debug/app-debug.apk "PoloLauncher_v${{ steps.ver.outputs.v }}_debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: PoloLauncher_v${{ steps.ver.outputs.v }}_debug
          path: PoloLauncher_v${{ steps.ver.outputs.v }}_debug.apk

      - name: Release mit APK veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.ver.outputs.v }}
        run: |
          FILE="PoloLauncher_v${V}_debug.apk"
          if gh release view "v${V}" >/dev/null 2>&1; then
            gh release upload "v${V}" "$FILE" --clobber
          else
            gh release create "v${V}" "$FILE" --target "${GITHUB_SHA}" \
              --title "PoloLauncher v${V}" \
              --notes "Debug-APK (Paket de.ronny.pololauncher.debug). Änderungen siehe README und TESTBERICHT_v${V}.md."
          fi

      # Nur zur Information: ein Fehlschlag hier verhindert die APK nicht.
      - name: Tests (Java, ohne Android)
        continue-on-error: true
        run: sh tests/run-tests.sh

      - name: Kompilierprüfung gegen Android-API
        continue-on-error: true
        run: ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar" sh tests/compile-check.sh
